# idlproj.yml: the whole LiveContainer+SideStore build, driven by idl
# (~/projs/ios-dev-linux).
#
#   idl build                         # -> build/LiveContainer.ipa and
#                                     #    build/LiveContainer+SideStore.ipa (post_build)
#   idl build LiveContainerSwiftUI    # one target plus its dependencies
#   idl clean
#
# Targets mirror upstream's Xcode targets. Frameworks, dylibs and extensions
# are built first and embedded into the LiveContainer app; the static targets
# (App Store auth stack) are linked into LiveContainerSwiftUI.framework.

toolchain:
  sdk_bundle: ~/.swiftpm/swift-sdks/darwin.artifactbundle
  swiftly_bin: ~/.local/share/swiftly/bin

defaults:
  min_ios: "15.0"
  build_dir: build
  frameworks: [UIKit, Foundation]
  defines: ["NS_BLOCK_ASSERTIONS=1"]
  cflags: [-w]
  swiftflags: [-swift-version, "5", -Xcc, -DNS_BLOCK_ASSERTIONS=1]
  # Xcode's header map: any project header is reachable by its bare name.
  quote_include_dirs:
    - LiveContainer
    - LiveContainer/Tweaks
    - LiveContainerSwiftUI
    - LiveContainerSwiftUI/Models
    - LiveContainerSwiftUI/Utilities
    - LiveContainerSwiftUI/Utilities/AppStore
    - LiveContainerSwiftUI/Utilities/FairPlay
    - LiveContainerSwiftUI/Utilities/WorseQuery
    - MultitaskSupport
    - ShareExtension
    - LaunchAppExtension
    - SideStoreSupport
    - ZSign
    - ZSign/common
    - litehook/src
    - litehook/external/include
  # idl lint / idl fmt: vendored and generated code is not ours to restyle.
  lint:
    exclude: [ZSign, litehook, LiveContainer/Tweaks/mach_excServer.c]
  format:
    exclude: [ZSign, litehook, AppStoreAuth, LiveContainer/Tweaks/mach_excServer.c]
    clang_format:
      DerivePointerAlignment: true
      PointerAlignment: Right
      AllowShortIfStatementsOnASingleLine: WithoutElse
      AllowShortBlocksOnASingleLine: Always
      AllowShortFunctionsOnASingleLine: All
      AllowShortLoopsOnASingleLine: true
      AllowShortCaseLabelsOnASingleLine: true
      IndentCaseLabels: true
      ObjCSpaceAfterProperty: false
      SpacesBeforeTrailingComments: 1
      AlignTrailingComments: false
      AlignConsecutiveMacros: None
      AlignEscapedNewlines: DontAlign
      AlignOperands: DontAlign
      MaxEmptyLinesToKeep: 2
      KeepEmptyLines:
        AtStartOfBlock: true
        AtStartOfFile: true
        AtEndOfFile: true
      BreakBeforeBraces: Attach
      ReflowComments: Never
      ObjCBreakBeforeNestedBlockParam: false
  plist_vars:
    DEVELOPMENT_TEAM: AAAAA11111
    AppIdentifierPrefix: "AAAAA11111."
    APP_GROUP_SIDESTORE: group.com.SideStore.SideStore
    APP_GROUP_ALTSTORE: group.com.rileytestut.AltStore

targets:
  # ------------------------------------------------------------ app
  - name: LiveContainer
    bundle_id: com.kdt.livecontainer
    version: "3.7.11"
    build_number: "1"
    # main.c is a dlopen bootstrap; everything else is loaded from Frameworks/.
    sources: [LiveContainer/main.c]
    frameworks: []
    ldflags: [-e, _LiveContainerMainC]
    info_plist: LiveContainer/Info.plist
    info:
      LCVersionInfo: "Release ($(GIT_BRANCH)/$(GIT_COMMIT))"
      CFBundleDevelopmentRegion: en
      UIApplicationSupportsIndirectInputEvents: true
      UILaunchStoryboardName: ~
      UILaunchImageFile: ~
      UILaunchImages: ~
    entitlements: entitlements.xml
    resources:
      - Resources/Assets.xcassets
      - Resources/Settings.bundle
      - Resources/universal.js
      - Resources/DefaultIcon.png
      - Resources/AppIconGrey60x60@2x.png
      - "Resources/AppIconGrey76x76@2x~ipad.png"
      - Resources/Localizable.xcstrings
      - "Resources/*.lproj"
      - LiveContainerSwiftUI/ViewApp.intentdefinition
      - Resources/Frameworks/CydiaSubstrate.framework
      - OpenSSL/Frameworks/iphoneos/OpenSSL.framework
    embed:
      - LiveContainerShared
      - LiveContainerSwiftUI
      - SideStoreSupport
      - TweakLoader
      - ZSign
      - TestJITLess
      - LiveProcess
      - ShareExtension
      - LaunchAppExtension
    # 1. embed the built-in SideStore -> build/LiveContainer+SideStore.ipa
    # 2. install_on_device: install it through Jimpactor if a device is
    #    connected (skipped otherwise; IDL_NO_INSTALL=1 / IDL_DEVICE=<udid|name>)
    # `idl build --no-post-build` skips both.
    post_build:
      - [bash, build-support/embed-sidestore.sh]
      - [bash, build-support/install-on-device.sh]

  # ----------------------------------------------------- frameworks
  - name: LiveContainerShared
    type: framework
    bundle_id: com.kdt.livecontainer.LiveContainerShared
    sources:
      - LiveContainer/dyld_bypass_validation.m
      - LiveContainer/Localization.m
      - LiveContainer/LCMachOUtils.m
      - LiveContainer/LCSharedUtils.m
      - LiveContainer/LCBootstrap.m
      - LiveContainer/utils.m
      - LiveContainer/Tweaks
      - litehook/src/litehook.c
    frameworks: [Foundation, UIKit, Security]
    cflags: [-w, -fcommon, -DFISHHOOK_EXPORT=1]

  - name: LiveContainerSwiftUI
    type: framework
    bundle_id: com.kdtLiveContainerSwiftUI
    sources:
      - LiveContainerSwiftUI
      - MultitaskSupport
      - build-support/ViewAppIntent.swift
    bridging_header: LiveContainerSwiftUI/LiveContainerSwiftUI-Bridging-Header.h
    include_dirs: [AppStoreAuth/NativeStore/include]
    framework_dirs: [AppStoreAuth]
    link: [LiveContainerShared, NativeStore, SAPKit, MacAnisetteKit, AppStoreCore]
    frameworks: [UIKit, Foundation, IOKit, Security, MacADICore]
    libraries: [archive, z, c++, resolv, compression, bz2]
    ldflags: [-U, _OBJC_CLASS_$_RBSTarget]

  - name: SideStoreSupport
    type: framework
    bundle_id: com.kdt.livecontainer.SideStoreSupport
    sources: [SideStoreSupport]
    bridging_header: SideStoreSupport/SideStore-Bridging-Header.h
    swiftflags: [-swift-version, "5", -Xcc, -DNS_BLOCK_ASSERTIONS=1, -enable-upcoming-feature, MemberImportVisibility]
    link: [LiveContainerShared]

  # ---------------------------------------- App Store auth (static)
  # MacADICore.framework is a prebuilt static CoreADI (incl. Unicorn).
  - name: NativeStore
    type: static
    sources: [AppStoreAuth/NativeStore/NativeStore.m]
    include_dirs: [AppStoreAuth/NativeStore/include]

  - name: SAPKit
    type: static
    sources: [AppStoreAuth/SAPKit]
    framework_dirs: [AppStoreAuth]

  - name: MacAnisetteKit
    type: static
    sources: [AppStoreAuth/MacAnisetteKit]
    framework_dirs: [AppStoreAuth]
    include_dirs: [AppStoreAuth/NativeStore/include]

  - name: AppStoreCore
    type: static
    sources: [AppStoreAuth/AppStoreCore]
    framework_dirs: [AppStoreAuth]
    include_dirs: [AppStoreAuth/NativeStore/include]
    link: [SAPKit, MacAnisetteKit]

  # --------------------------------------------------------- dylibs
  - name: TweakLoader
    type: dylib
    sources: [TweakLoader]
    ldflags:
      - -U
      - _OBJC_CLASS_$_FBSSceneParameters
      - -U
      - _OBJC_CLASS_$_LSApplicationWorkspace
      - -U
      - _OBJC_CLASS_$_DOCConfiguration

  - name: ZSign
    type: dylib
    sources: [ZSign]
    # <openssl/x.h> -> OpenSSL.framework/Headers on a case-sensitive filesystem
    include_dirs: [build-support/include]
    framework_dirs: [OpenSSL/Frameworks/iphoneos]
    frameworks: [OpenSSL, Foundation]
    cflags: [-w, -fno-modules]

  - name: TestJITLess
    type: dylib
    sources: [TestJITLess]
    frameworks: [Foundation]

  # ----------------------------------------------------- extensions
  - name: LiveProcess
    type: appex
    bundle_id: com.kdt.livecontainer.LiveProcess
    sources: [LiveProcess]
    link: [LiveContainerShared]
    frameworks: [Foundation]
    ldflags: [-e, _NSExtensionMain]
    dead_strip: false
    info_plist: LiveProcess/Info.plist
    entitlements: LiveProcess/LiveProcess.entitlements
    info:
      CFBundleDisplayName: LiveProcess
      GCSupportsControllerUserInteraction: true
      GCSupportsGameMode: true
      NFCReaderUsageDescription: The guest app is requesting for this permission.
      NSAppleMusicUsageDescription: The guest app is requesting for this permission.
      NSBluetoothAlwaysUsageDescription: The guest app is requesting for this permission.
      NSBluetoothPeripheralUsageDescription: The guest app is requesting for this permission.
      NSCameraUsageDescription: The guest app is requesting for this permission.
      NSContactsUsageDescription: The guest app is requesting for this permission.
      NSFaceIDUsageDescription: The guest app is requesting for this permission.
      NSFallDetectionUsageDescription: The guest app is requesting for this permission.
      NSGKFriendListUsageDescription: The guest app is requesting for this permission.
      NSHealthClinicalHealthRecordsShareUsageDescription: The guest app is requesting for this permission.
      NSHealthShareUsageDescription: The guest app is requesting for this permission.
      NSHealthUpdateUsageDescription: The guest app is requesting for this permission.
      NSHomeKitUsageDescription: The guest app is requesting for this permission.
      NSIdentityUsageDescription: The guest app is requesting for this permission.
      NSLocalNetworkUsageDescription: The guest app is requesting for this permission.
      NSLocationAlwaysAndWhenInUseUsageDescription: The guest app is requesting for this permission.
      NSLocationTemporaryUsageDescriptionDictionary: The guest app is requesting for this permission.
      NSLocationUsageDescription: The guest app is requesting for this permission.
      NSLocationWhenInUseUsageDescription: The guest app is requesting for this permission.
      NSMicrophoneUsageDescription: The guest app is requesting for this permission.
      NSMotionUsageDescription: The guest app is requesting for this permission.
      NSNearbyInteractionAllowOnceUsageDescription: The guest app is requesting for this permission.
      NSNearbyInteractionUsageDescription: The guest app is requesting for this permission.
      NSPhotoLibraryAddUsageDescription: The guest app is requesting for this permission.
      NSPhotoLibraryUsageDescription: The guest app is requesting for this permission.
      NSSensorKitUsageDescription: The guest app is requesting for this permission.
      NSSiriUsageDescription: The guest app is requesting for this permission.
      NSSpeechRecognitionUsageDescription: The guest app is requesting for this permission.
      NSUserTrackingUsageDescription: The guest app is requesting for this permission.

  - name: ShareExtension
    type: appex
    bundle_id: com.kdt.livecontainer.ShareExtension
    min_ios: "16.0"
    version: "3.7.11"
    build_number: "3.7.11"
    sources: [ShareExtension]
    bridging_header: ShareExtension/ShareExtension-Bridging-Header.h
    swiftflags: [-swift-version, "5", -Xcc, -DNS_BLOCK_ASSERTIONS=1, -enable-upcoming-feature, MemberImportVisibility]
    link: [LiveContainerShared]
    frameworks: [Foundation]
    ldflags: [-e, _NSExtensionMain]
    info_plist: ShareExtension/Info.plist
    entitlements: ShareExtension/ShareExtension.entitlements

  - name: LaunchAppExtension
    type: appex
    bundle_id: com.kdt.livecontainer.LaunchAppExtension
    min_ios: "16.0"
    sources: [LaunchAppExtension]
    bridging_header: LaunchAppExtension/LaunchAppExtension-Bridging-Header.h
    swiftflags: [-swift-version, "5", -Xcc, -DNS_BLOCK_ASSERTIONS=1, -enable-upcoming-feature, MemberImportVisibility]
    link: [LiveContainerShared]
    frameworks: []
    info_plist: LaunchAppExtension/Info.plist
    entitlements: LaunchAppExtension/LaunchAppExtension.entitlements
    info:
      CFBundleDisplayName: LaunchAppExtension
